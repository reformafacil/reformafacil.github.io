<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#6d5dfc">
<title>Pagamento — Reforma Fácil</title>
<link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png">
<style>
  :root { --bg: #f0f2f7; --card: #fff; --ink: #0f1222; --muted: #5d6280; --ok: #12b76a; --err: #f04438;
    --grad: linear-gradient(135deg, #6d5dfc 0%, #c94bff 50%, #ff6a88 100%); }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0c14; --card: #151724; --ink: #f2f3fa; --muted: #9aa0bd; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
  .caixa { width: 100%; max-width: 460px; background: var(--card); border-radius: 28px; padding: 32px 28px; text-align: center;
    box-shadow: 0 12px 40px rgba(16,18,34,.12); }
  .ico { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 16px; display: grid; place-items: center; font-size: 34px; background: var(--grad); color: #fff; }
  .ico.ok { background: var(--ok); } .ico.erro { background: var(--err); }
  .gira { width: 34px; height: 34px; border: 4px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: g 0.9s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  h1 { font-size: 23px; margin: 0 0 8px; letter-spacing: -.02em; }
  p { color: var(--muted); margin: 0 0 12px; }
  b { color: var(--ink); }
  .btn { display: inline-block; margin-top: 10px; background: var(--grad); color: #fff; text-decoration: none; font-weight: 700; padding: 13px 24px; border-radius: 99px; }
  .sec { background: transparent; color: var(--ink); border: 1.5px solid rgba(128,128,160,.35); }
  .rec { font-size: 14px; } .rec a { color: #6d5dfc; }
</style>
</head>
<body>
  <div class="caixa" id="caixa">
    <div class="ico"><div class="gira"></div></div>
    <h1>Confirmando o pagamento…</h1>
    <p>Isso costuma levar poucos segundos.</p>
  </div>

<script src="firebase-config.js"></script>
<script type="module">
  const caixa = document.getElementById('caixa');
  const q = new URLSearchParams(location.search);
  const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const recibo = q.get('receipt_url');
  const linkRecibo = recibo && /^https:\/\//.test(recibo) ? `<p class="rec"><a href="${esc(recibo)}" target="_blank" rel="noopener">Ver comprovante</a></p>` : '';
  const tela = (ico, titulo, texto, botoes = '') => { caixa.innerHTML = `<div class="ico ${ico}">${ico === 'ok' ? '✓' : ico === 'erro' ? '!' : '<div class="gira"></div>'}</div><h1>${titulo}</h1>${texto}${botoes}`; };

  const dados = { order_nsu: q.get('order_nsu'), slug: q.get('slug'), transaction_nsu: q.get('transaction_nsu') };
  if (!dados.order_nsu || !dados.slug || !dados.transaction_nsu || !window.FUNCOES_URL) {
    tela('erro', 'Não encontramos o pagamento', '<p>Este endereço está incompleto. Se você pagou, fique tranquilo: a confirmação também chega por outro caminho e o acesso é liberado automaticamente.</p>',
      '<a class="btn" href="app.html">Abrir o app</a>');
  } else {
    let tentativas = 0;
    const tentar = async () => {
      tentativas++;
      let r = null;
      try {
        const resp = await fetch(window.FUNCOES_URL + '/confirmarPagamento', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dados) });
        r = await resp.json();
      } catch (e) { r = { status: 'erro' }; }

      if (r.status === 'pago') return sucesso(r);
      if (tentativas < 20 && ['pendente', 'erro'].includes(r.status)) {
        if (tentativas === 4) tela('', 'Aguardando a confirmação…', '<p>Pagamentos por Pix podem levar alguns instantes. Não feche esta página.</p>');
        return setTimeout(tentar, 3000);
      }
      tela('erro', 'Pagamento ainda não confirmado', `<p>Ainda não recebemos a confirmação deste pagamento. Se você concluiu o pagamento, o acesso será liberado automaticamente assim que a InfinitePay confirmar. Pedido: <b>${esc(dados.order_nsu)}</b>.</p>${linkRecibo}`,
        '<a class="btn sec" href="./#acesso">Falar com a gente</a>');
    };

    async function sucesso(r) {
      const chave = 'rtc-senha-enviada-' + dados.order_nsu;
      if (r.novaConta) {
        // envia o e-mail de criar senha uma vez por pedido (recarregar a página não reenvia)
        if (localStorage.getItem(chave) !== 'enviado') try {
          const V = '13.4.0';
          const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
          const U = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
          const app = A.initializeApp(window.FIREBASE_CONFIG);
          const auth = U.getAuth(app); auth.languageCode = 'pt-BR';
          await U.sendPasswordResetEmail(auth, r.email);
          localStorage.setItem(chave, 'enviado');
        } catch (e) { console.error(e); }
        localStorage.removeItem('rtc-assinatura');
        return tela('ok', 'Pagamento confirmado!', `<p>Bem-vindo ao Reforma Fácil. Enviamos para <b>${esc(r.email)}</b> um e-mail com o link para você <b>criar a sua senha</b>.</p>
          <p>Não chegou? Confira a caixa de spam ou use "Esqueci minha senha" na tela de entrada.</p>${linkRecibo}`, '<a class="btn" href="app.html">Ir para o app</a>');
      }
      localStorage.removeItem('rtc-assinatura');
      tela('ok', 'Pagamento confirmado!', `<p>O acesso de <b>${esc(r.email)}</b> foi liberado e o novo período já foi somado. É só entrar com a sua senha de sempre.</p>${linkRecibo}`,
        '<a class="btn" href="app.html">Ir para o app</a>');
    }
    tentar();
  }
</script>
</body>
</html>
